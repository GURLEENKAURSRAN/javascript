<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissor</title>
  </head>

  <body>
    <p>Rock Paper Scissors</p>

    <button onclick="
      playGame('Rock');
      ">Rock</button>
  
    <button onclick="
      playGame('Paper');
      ">Paper</button> 

    <button onclick="
      playGame('Scissors');
    ">Scissors</button>

    <p><a href="https://supersimple.dev/projects/rock-paper-scissors" >Click here</a> to see the final version of the project</p>

    <script>
      function playGame(playerMove){
        const compMove=pickCompMove();

        let result = '';

        if (playerMove=="Rock"){
          if (compMove === 'Rock') {
            result = 'Tie.';
          }
          else if (compMove === 'Paper'){
            result = 'You lose.';
          }
          else if (compMove === 'Scissor'){
            result = 'You win.';
          }
        }

        else if (playerMove=="Paper"){
          if (compMove === 'Rock') {
            result='You win.';
          }
          else if (compMove === 'Paper'){
            result='Tie.';
          }
          else if (compMove === 'Scissor'){
            result='You lose.';
          }
        }

        else if (playerMove=="Scissors"){
          if (compMove === 'Rock') {
          result='You lose.';
          }
          else if (compMove === 'Paper'){
            result='You win.';
          }
          else if (compMove === 'Scissor'){
            result='Tie.';
          }
        }

          alert(`You picked ${playerMove}. Computer picked ${compMove }. ${result}`);
        }

      function pickCompMove(){
        const random = Math.random();
        let move='';

        if (random >= 0 && random < 
        1 / 3 ) {
          move='Rock';
        } else if (random >= 1 / 3 && random < 2 / 3) {
          move='Paper';
        } else if ( random >= 2 / 3 && random < 1) {
          move='Scissor';
        }
        return move;
      }
    </script>

  </body>
</html>
